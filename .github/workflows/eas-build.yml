# Native store builds on Expo's cloud (EAS). Requires the repository secret EXPO_TOKEN
# (expo.dev → Account settings → Access tokens). App identifiers and AdMob ids come from the
# EAS environment variables listed in docs/BUILD.md, not from this file.
name: EAS build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: Build profile (eas.json)
        type: choice
        options: [production, preview, development]
        default: production
      submit:
        description: Submit the finished production build to App Store Connect / Play Console
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test -- --ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        run: >
          eas build --non-interactive --wait
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
